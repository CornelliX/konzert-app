name: Deploy & Scrape

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: cd scraper && npm install

      - name: Run scraper
        run: cd scraper && node scrape.js

      - name: Copy events.json to public
        run: cp scraper/public/events.json public/events.json

      # Frischen Scrape-Stand zurück nach main committen, damit der 0-Events-Fallback in
      # scrape.js (main(), fallbackLocationIds) bei künftigen einzelnen Scraper-Ausfällen
      # auf einen aktuellen statt monatealten Snapshot zurückgreifen kann.
      - name: Commit refreshed events.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Scraper-Snapshot aktualisieren [skip ci]"
          file_pattern: 'scraper/public/events.json public/events.json'

      - name: Install app dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
