name: Deploy & Scrape

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Der wöchentliche Cron hier ist die einzige garantierte regelmäßige Aktivität für das
      # Supabase-Projekt (der Scraper selbst spricht nie mit Supabase). Free-Tier-Projekte
      # pausieren nach 7 Tagen Inaktivität automatisch - eine simple authentifizierte Anfrage
      # zählt als Aktivität und verhindert das.
      - name: Supabase wach halten
        run: |
          curl -sf "https://cqxpjesovcavarrlljpn.supabase.co/rest/v1/manual_events?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHBqZXNvdmNhdmFycmxsanBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NjI4MjYsImV4cCI6MjA4ODAzODgyNn0._paXbtV1uecR0AA08KUkKLfRkmkQw2k4W3hT5L2y2ho" \
            -o /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: cd scraper && npm install

      - name: Run scraper
        run: cd scraper && node scrape.js

      - name: Copy events.json to public
        run: cp scraper/public/events.json public/events.json

      # Frischen Scrape-Stand zurück nach main committen, damit der 0-Events-Fallback in
      # scrape.js (main(), fallbackLocationIds) bei künftigen einzelnen Scraper-Ausfällen
      # auf einen aktuellen statt monatealten Snapshot zurückgreifen kann.
      - name: Commit refreshed events.json
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: Scraper-Snapshot aktualisieren [skip ci]"
          file_pattern: 'scraper/public/events.json public/events.json'

      - name: Install app dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
