  <body class="bg-gray-950 text-white min-h-screen">
    <!-- C64-Intro: steht hier statt im Bundle, damit es mit dem ersten Bild erscheint. Konstant 2 s: 1,6 s ab dem ersten
         Bild, dann 0,4 s Ausblenden, beides über requestAnimationFrame (siehe Skript unten). Ist die App nach 1,6 s
         noch nicht fertig, wartet das Intro, bis renderApp() window.__introRelease() aufruft. -->
    <div class="c64-border" id="c64-intro" style="position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
                width:min(100%,576px); z-index:9999;
                padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));">
      <div style="width:100%; height:100%; background:#2020AA; overflow:hidden;
                  font-family:'Press Start 2P',monospace; color:#9898FF;
                  font-size:min(calc((min(100vw,576px) - 80px) / 38), 13.1px); line-height:2.3;
                  padding:14px 12px;">
        <div>**** COMMODORE 64 BASIC V2 ****</div>
        <div>64K RAM SYSTEM&nbsp; 38911 BASIC BYTES FREE</div>
        <div>&nbsp;</div>
        <div>READY.</div>

        <div>PRESS PLAY ON TAPE</div>
        <div>OK</div>
        <div>&nbsp;</div>
        <div>MADE BY CRUX WITH CLAUDE</div>
        <div>CO-TESTED BY DR. JEEP</div>
        <div>&nbsp;</div>
        <div>READY.</div>
        <div>RUN<span style="display:inline-block; width:0.6em; height:1em; background:#9898FF; vertical-align:text-bottom; margin-left:0.15em; animation:c64blink 0.7s step-end infinite;"></span></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('c64-intro'), d = document.documentElement
        if (d.classList.contains('no-intro')) { el.remove(); return }
        var ready = false, out = false, shown = 0, fadeStart = 0
        // ponytail: Diagnose fürs iPhone (siehe Anleitung unten); entfernen, sobald das Intro passt
        var T = window.__startT = { raf: 0, sicht: document.visibilityState, wechsel: [], renders: [], pausen: [], timer: 0 }
        document.addEventListener('visibilitychange', function () { T.wechsel.push(document.visibilityState + ' ' + (performance.now() / 1000).toFixed(1)) })
        addEventListener('load', function () { T.load = performance.now() })
        function save() {
          try {
            var nav = performance.getEntriesByType('navigation')[0], fcp = performance.getEntriesByName('first-contentful-paint')[0]
            T.html = nav ? nav.responseEnd : 0; T.ready = window.__appReadyAt || 0
            T.fcp = fcp ? fcp.startTime : -1; T.tw = window.__twAt || 0; T.gf = window.__gfAt || 0; T.at = Date.now()
            localStorage.setItem('startTiming', JSON.stringify(T))
          } catch (err) {}
        }
        function fadeOut() {
          if (out || !ready) return
          out = true; fadeStart = performance.now(); T.fade = fadeStart
          // Ausblenden als CSS-Übergang: läuft im Compositor weiter, auch wenn die Seite danach kurz hängt
          // (Messung iPhone: per Bild gesetzte Deckkraft fror mitten im Ausblenden für 4 s ein)
          el.style.pointerEvents = 'none'; el.style.transition = 'opacity 0.4s ease-in-out'; el.style.opacity = '0'
          d.classList.remove('intro-on')   // jetzt starten die Glow-Animationen im Header
          save()
        }
        // Zeitsteuerung über die Bildwiederholung statt setTimeout/CSS-Verzögerung: auf dem iPhone kamen beide erst beim
        // nächsten Neuzeichnen der Seite (Messung: Ausblenden bei 4,6-4,9 s statt 2 s), die Bilder liefen dagegen weiter.
        // 1,6 s ab dem ersten Bild stehen, dann 0,4 s ausblenden (CSS-Übergang, siehe fadeOut).
        var lastF = 0
        function frame(t) {
          if (!shown) { shown = t; T.raf = t }
          if (lastF && t - lastF > 200 && T.pausen.length < 8) T.pausen.push((lastF / 1000).toFixed(1) + '+' + ((t - lastF) / 1000).toFixed(1))
          lastF = t
          if (!out && t - shown >= 1600) fadeOut()
          if (fadeStart && el.isConnected && t - fadeStart > 450) el.remove()
          if (t < 8000 || el.isConnected) requestAnimationFrame(frame)
          else save()
        }
        requestAnimationFrame(frame)
        setTimeout(function () { T.timer = performance.now() }, 1600)   // Diagnose: wann ein 1,6-s-Timer wirklich kommt
        window.__introRelease = function () {
          ready = true; window.__appReadyAt = performance.now()
          if (shown && performance.now() - shown >= 1600) fadeOut()
        }
        // Sicherung, falls die App nie fertig wird (z. B. Fehler): nach 10 s weg
        setTimeout(function () { ready = true; fadeOut(); el.remove() }, 10000)
      })()
    </script>
    <div id="app"></div>
  </body>
